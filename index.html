<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코밀 Co-Meal — 동작구 밥친구 매칭</title>
<meta name="theme-color" content="#C4401F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--accent:#C4401F;--accent-d:#A23517;--tint:#FBE9E1;--tint-t:#A23517;--cream:#F6EDE3;--ink:#3A2621;--txt:#2A1D19;--sub:#6E625D;--line:#EEE6DE;--gray:#F4EFEA;--blue:#2F5D8A;--blue-bg:#E8F0F8;--green:#2F6B45;--green-bg:#E5F2E9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E1D8}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--txt);letter-spacing:-0.2px;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;height:100%;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.app.wide{max-width:1180px}
.adm{padding:24px 32px 48px}
.ahdr{display:flex;align-items:center;justify-content:space-between;padding:18px 32px 10px;gap:12px;flex-wrap:wrap}
.atabs{display:flex;flex-wrap:wrap;padding:0 32px;border-bottom:1px solid var(--line)}
.atab{border:0;background:none;padding:12px 4px;margin-right:22px;font-size:15px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;min-height:48px}
.atab.on{color:var(--ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--cream);border-radius:14px;padding:16px 18px;font-size:13px;color:var(--sub);font-weight:700}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--ink);margin-top:4px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.tbl th{text-align:left;font-size:12px;color:var(--sub);font-weight:700;padding:12px 12px;border-bottom:1px solid var(--line);background:#FBF7F3}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.aform{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:28px;padding:22px;border:1px solid var(--line);border-radius:14px;background:#FFFCF9}
.ah2{font-size:18px;font-weight:800;margin:0 0 14px}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:21px;font-weight:900;color:var(--accent);letter-spacing:-0.4px}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.iconbtn:hover{background:var(--gray)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{margin:4px 20px 16px;padding:20px;background:var(--ink);border-radius:18px;color:#fff}
.hero .k{font-size:13px;color:#F2C9B8;font-weight:700}
.hero .t{font-size:20px;font-weight:800;line-height:1.4;margin-top:4px}
.hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;flex-shrink:0}
.pill:hover{background:var(--accent-d)}
.pill.light{background:#fff;color:var(--ink)}
.pill.light:hover{background:var(--cream)}
.sep{height:8px;background:var(--gray)}
.sec{padding:20px 20px 6px}
.sec h2{margin:0;font-size:18px;font-weight:800}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.muted{font-size:13px;color:var(--sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCD2C8;background:#fff;color:#4A3F3A;font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.list{padding:2px 20px 24px}
.card{width:100%;border:0;background:none;padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;text-align:left}
.thumb{width:84px;height:84px;flex-shrink:0;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:800;color:#3A2A20;word-break:keep-all}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ctitle{font-size:16px;font-weight:700;line-height:1.35;word-break:keep-all}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:12px;font-weight:500;color:#4A3F3A;background:var(--gray);padding:3px 8px;border-radius:6px}
.tag.quiet{color:var(--blue);background:var(--blue-bg);font-weight:700}
.tag.talk{color:var(--tint-t);background:var(--tint);font-weight:700}
.tag.g{color:#5B3FA0;background:#EFE9FA;font-weight:700}
.tag.full{color:#fff;background:#6E625D;font-weight:700}
.tag.new{color:#fff;background:var(--accent);font-weight:700}
.tag.warn{color:#B3261E;background:#FDECEA;font-weight:700}
.tag.ok{color:var(--green);background:var(--green-bg);font-weight:700}
.tag.bolt{color:#7A4A00;background:#FFF0C9;font-weight:700}
.reason{font-size:12px;font-weight:700;color:var(--green)}
.hostline{font-size:12px;color:var(--sub)}
.cnt{font-size:13px;font-weight:700;color:var(--accent)}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-size:16px}
.nav{flex-shrink:0;height:68px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9A8F89;font-size:11px;font-weight:700}
.nav button.on{color:var(--ink)}
.badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center}
.top{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;position:sticky;top:0;background:#fff;z-index:2}
.top h1{margin:0;font-size:17px;font-weight:800}
.dhero{height:180px;display:flex;align-items:flex-end;padding:20px;font-size:28px;font-weight:800;color:#3A2A20;word-break:keep-all}
.pad{padding:20px}
.dl{margin:0;padding:8px 20px}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.dl div:last-child{border-bottom:0}
.dl dt{font-size:14px;color:var(--sub);flex-shrink:0}
.dl dd{margin:0;font-size:14px;font-weight:700;text-align:right;word-break:keep-all}
.note{margin:4px 20px 16px;padding:16px;border-radius:12px;background:var(--cream);font-size:14px;line-height:1.6;color:var(--txt);white-space:pre-wrap;word-break:break-word}
.subh{font-size:15px;font-weight:800;margin:0;padding:18px 20px 0}
.members{display:flex;flex-direction:column;gap:14px;padding:12px 20px 20px}
.mem{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:21px;background:var(--tint);color:var(--tint-t);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.mrow{display:flex;flex-direction:column;gap:8px}
.memact{display:flex;gap:6px;flex-wrap:wrap;padding-left:54px}
.mbtn{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid #DCD2C8;background:#fff;font-size:13px;font-weight:700}
.mbtn:disabled{color:#A49A94;cursor:default}
.mbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn.warn{color:#B3261E;border-color:#F0C4C0}
.more{margin-left:auto;width:44px;height:44px;border:0;background:none;border-radius:22px;font-size:20px;font-weight:800;color:var(--sub)}
.more:hover{background:var(--gray)}
.bar{flex-shrink:0;padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
.btn{flex:1;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.btn:hover{background:var(--accent-d)}
.btn:disabled{background:#CFC6BF;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #DCD2C8}
.btn.ghost:hover{background:var(--gray)}
.btn.sm{height:44px;font-size:14px;flex:0 0 auto;padding:0 16px}
.form{padding:8px 20px 24px;display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-size:15px;font-weight:700}
.inp{height:48px;border:1px solid #DCD2C8;border-radius:12px;padding:0 14px;font-size:15px;background:#fff;outline:none;width:100%}
textarea.inp{height:88px;padding:12px 14px;resize:none;line-height:1.5}
.inp:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mood{display:flex;flex-direction:column;gap:10px}
.moodbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:15px;border-radius:14px;background:#fff;border:1px solid #DCD2C8}
.moodbtn.on{background:var(--tint);border:2px solid var(--accent);padding:14px}
.moodbtn b{font-size:15px}
.moodbtn span{font-size:13px;color:var(--sub);line-height:1.5}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid #DCD2C8;background:#fff;font-size:20px;font-weight:700}
.stepper output{font-size:17px;font-weight:800;min-width:40px;text-align:center}
.chat{padding:4px 20px 12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:80%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:11px;color:var(--sub)}
.msg .txt{padding:9px 13px;border-radius:14px;background:var(--gray);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me .txt{background:var(--accent);color:#fff}
.sysmsg{align-self:center;font-size:12px;font-weight:700;color:var(--green);background:var(--green-bg);padding:5px 12px;border-radius:12px}
.chatin{display:flex;gap:8px;padding:0 20px 16px}
.banner2{margin:12px 20px 0;padding:12px 14px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:13px;line-height:1.5}
.banner2.red{background:#FDECEA;color:#B3261E}
.banner2.green{background:var(--green-bg);color:var(--green)}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:500;white-space:nowrap;z-index:10;pointer-events:none}
.notice{position:absolute;left:12px;right:12px;top:12px;z-index:11;border:0;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.confirm{margin:0 20px 16px;padding:16px;border:1px solid #F3C6B5;background:#FFF8F5;border-radius:12px;display:flex;flex-direction:column;gap:12px}
.confirm .acts{display:flex;gap:8px}
.pcard{margin:12px 20px 0;padding:18px;border-radius:16px;background:var(--cream);display:flex;flex-direction:column;gap:10px}
.pcard .av{width:52px;height:52px;border-radius:26px;font-size:19px;background:#fff}
.mtags{display:flex;gap:6px;flex-wrap:wrap}
.mtag{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid #E5D9CD;padding:4px 9px;border-radius:14px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:8px 0;min-height:44px}
.ckrow{display:flex;align-items:flex-start;gap:12px;border:0;background:none;text-align:left;padding:10px 0;font-size:14px;line-height:1.5;min-height:44px}
.ck{width:24px;height:24px;flex-shrink:0;border-radius:7px;border:2px solid #C9BFB7;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.ck.on{background:var(--accent);border-color:var(--accent)}
.adrow{display:flex;gap:12px;overflow-x:auto;padding:12px 20px 4px}
.adrow::-webkit-scrollbar{display:none}
.adc{flex:0 0 200px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.adth{height:84px;display:flex;align-items:flex-end;padding:10px;font-weight:800;font-size:13px;color:#3A2A20}
.adb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.adb b{font-size:15px}
.adl{font-size:11px;font-weight:700;color:var(--sub);border:1px solid #CFC5BC;border-radius:4px;padding:0 5px;align-self:flex-start}
.adp{font-size:12px;font-weight:700;color:var(--accent)}
.perk{margin:4px 20px 16px;padding:14px 16px;border-radius:12px;background:var(--tint);display:flex;flex-direction:column;gap:4px;color:var(--tint-t);font-size:14px;line-height:1.5}
.rv{margin:12px 20px;padding:16px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px;padding:4px 20px 0;flex-wrap:wrap}
.step{font-size:12px;font-weight:700;color:#A49A94;background:var(--gray);padding:5px 10px;border-radius:12px}
.step.on{color:#fff;background:var(--ink)}
.step.done{color:var(--green);background:var(--green-bg)}
</style>
</head>

function safeId(s){return String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');}
function when(t){var d=new Date(t.date+'T'+(t.time||'12:00'));return isNaN(d)?0:d.getTime();}
function slotOf(time){var h=parseInt((time||'12').slice(0,2),10);return h<15?'점심':(h<21?'저녁':'야식');}
function dayLabel(date){var today=ymd(new Date()),tm=new Date();tm.setDate(tm.getDate()+1);if(date===today)return '오늘';if(date===ymd(tm))return '내일';var d=new Date(date+'T00:00');if(isNaN(d))return date;return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')';}
function timeLabel(t){var p=(t.time||'').split(':');var h=+p[0],m=p[1]||'00';if(isNaN(h))return '';return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+m;}
function fmtDate(ms){var d=new Date(ms);return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
function byId(id){return tables.filter(function(x){return x.id===id;})[0];}
function toast(msg){S.toast=msg;render();clearTimeout(toast._t);toast._t=setTimeout(function(){S.toast='';render();},2400);}
function fail(e){S.busy=false;if(e&&e.code==='permission-denied'){toast('권한이 없어서 저장하지 못했어요');render();return;}if(e&&e.code==='invalid_argument'&&canWrite!==true){readOnly=true;toast('이 링크에서는 둘러보기만 할 수 있어요');return;}if(e&&e.code==='quota_exceeded'){toast('저장 공간이 가득 찼어요');return;}toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요');render();}

// ---------- people ----------
function prof(id){return profiles[id]||{};}
function me(){return prof(uid);}
function nick(id){var n=prof(id).nick;if(id===uid)return n||'나';return n||'이웃';}
function initial(id){return esc(nick(id).charAt(0));}
function genderOf(id){var g=prof(id).gender;return GL[g]?g:null;}
function gTxt(id){var g=genderOf(id);return g?GL[g]:'성별 미설정';}
function myGender(){return genderOf(uid);}
var THIS_YEAR=new Date().getFullYear();
var BAND_MID={'20대 초반':21,'20대 중반':25,'20대 후반':28,'30대':34,'40대 이상':45};
function bandOfAge(n){if(!n)return null;if(n<24)return '20대 초반';if(n<27)return '20대 중반';if(n<30)return '20대 후반';if(n<40)return '30대';return '40대 이상';}
function ageNum(id){var p=prof(id);if(p.birthYear)return THIS_YEAR-p.birthYear;return BAND_MID[p.age]||0;}
function ageOf(id){return bandOfAge(ageNum(id));}
function ageIdx(id){return AGES.indexOf(ageOf(id));}
function validBy(v){var n=parseInt(v,10);return n>=1950&&n<=THIS_YEAR-19?n:0;}
function ageRangeTxt(t){if(t.ageMin||t.ageMax)return (t.ageMin||19)+'~'+(t.ageMax||70)+'세';return t.ageNear?t.ageNear+' 또래':'';}
function dietsOf(id){return (prof(id).diets||[]).filter(function(d){return DIETS.indexOf(d)>=0;});}
function ageNearOk(t){if(t.ageMin||t.ageMax){var n=ageNum(uid);return !!n&&n>=(t.ageMin||19)&&n<=(t.ageMax||70);}if(!t.ageNear)return true;var a=ageIdx(uid),h=AGES.indexOf(t.ageNear);return a>=0&&h>=0&&Math.abs(a-h)<=1;}
function infoLine(id){var p=prof(id),x=[gTxt(id)];if(ageOf(id))x.push(ageOf(id));if(p.area)x.push(p.area);return x.join(' · ');}
function dietChips(id){var d=dietsOf(id);return d.length?'<div class="tags">'+d.map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join('')+'</div>':'';}
function isBlockedUser(id){return priv.blocks.indexOf(id)>=0;}
function mannerOf(id){var c={},again=0,n=0;Object.keys(reviews).forEach(function(by){var it=(reviews[by]&&reviews[by].items)||{};Object.keys(it).forEach(function(k){var r=it[k];if(!r||r.target!==id)return;n++;(r.tags||[]).forEach(function(tg){c[tg]=(c[tg]||0)+1;});if(r.again)again++;});});
  var top=Object.keys(c).sort(function(a,b){return c[b]-c[a];});return {counts:c,top:top,again:again,n:n};}
function isDismissed(by,k){return !!(moder.dismissed&&moder.dismissed[safeId(by)+'|'+k]);}
function isBanned(id){var b=bans[id];return b&&b.until>Date.now()?b.until:0;}
function nsTables(id){var s={};Object.keys(noshows).forEach(function(by){var it=(noshows[by]&&noshows[by].items)||{};Object.keys(it).forEach(function(k){var r=it[k];if(r&&r.target===id&&r.tableId&&!isDismissed(by,k))s[r.tableId]=Math.max(s[r.tableId]||0,r.at||0);});});return s;}
function nsCount(id){return Object.keys(nsTables(id)).length;}
function restrictedUntil(id){var bn=isBanned(id);if(bn)return bn;var s=nsTables(id),ks=Object.keys(s);if(ks.length<NS_LIMIT)return 0;var last=0;ks.forEach(function(k){last=Math.max(last,s[k]);});var u=last+NS_DAYS*864e5;return u>Date.now()?u:0;}
function myRestriction(){return uid?restrictedUntil(uid):0;}

// ---------- membership ----------
function reqsOf(t){return reqs.filter(function(r){return r.tableId===t.id;});}
function membersOf(t){var ids=[t.hostId];reqsOf(t).forEach(function(r){if(r.status==='accepted'&&ids.indexOf(r.userId)<0)ids.push(r.userId);});return ids;}
function pendingOf(t){return reqsOf(t).filter(function(r){return r.status==='pending';});}
function myReq(t){return reqsOf(t).filter(function(r){return r.userId===uid;})[0];}
function isMember(t){return membersOf(t).indexOf(uid)>=0;}
function isFull(t){return membersOf(t).length>=t.capacity;}
function upcoming(t){return when(t)>Date.now()-2*3600e3;}
function phase(t){var w=when(t),n=Date.now();if(n<w-2*3600e3)return 'before';if(n<w+3600e3)return 'day';if(n<w+REVIEW_WINDOW)return 'after';return 'closed';}
function gBlocked(t){return (t.genderOnly&&myGender()!==t.genderOnly)||!ageNearOk(t);}
function blockReason(t){if(t.genderOnly&&myGender()!==t.genderOnly)return GL[t.genderOnly]+'만 참여할 수 있어요';if(!ageNearOk(t))return ageNum(uid)?ageRangeTxt(t)+'만 참여할 수 있어요':'프로필에서 출생연도를 먼저 설정해 주세요';return '';}
function hasBlockedMember(t){return membersOf(t).some(function(id){return id!==uid&&isBlockedUser(id);});}
function reviewKey(t,target){return safeId(t.id)+'__'+safeId(target);}
function reviewedAll(t){var it=(reviews[uid]&&reviews[uid].items)||{};var ns=(noshows[uid]&&noshows[uid].items)||{};return membersOf(t).filter(function(id){return id!==uid;}).every(function(id){var k=reviewKey(t,id);return it[k]||ns[k];});}
function needsReview(t){return isMember(t)&&membersOf(t).length>1&&phase(t)==='after'&&!reviewedAll(t);}

// ---------- match score ----------
function matchInfo(t){
  var m=me(),sc=0,why=[];
  if(m.area&&t.area===m.area){sc+=3;why.push('같은 동네');}
  var ov=(m.purposes||[]).filter(function(p){return (t.purposes||[]).indexOf(p)>=0;});
  if(ov.length){sc+=2*ov.length;why.push(ov[0]);}
  var ai=ageIdx(uid),hi=ageIdx(t.hostId);if(ai>=0&&hi>=0&&Math.abs(ai-hi)<=1){sc+=1;why.push(ai===hi?'같은 연령대':'비슷한 또래');}
  var dv=dietsOf(uid).filter(function(d){return d!=='가리는 것 없어요'&&dietsOf(t.hostId).indexOf(d)>=0;});if(dv.length){sc+=1;why.push('식습관: '+dv[0]);}
  var mt=mannerOf(t.hostId);if(mt.again>0){sc+=1;why.push('재매칭 희망 '+mt.again+'회');}
  var h=(when(t)-Date.now())/3600e3;if(h>0&&h<24){sc+=1;}
  if(t.quick)sc+=1;
  return {score:sc,why:why};
}
function visible(t){return !isBlockedUser(t.hostId)&&!isBanned(t.hostId)&&!hasBlockedMember(t)&&t.status!=='closed';}

// ---------- private state ----------
function savePriv(){if(!uid||!db)return;if(privBusy){privQ=true;return;}privBusy=true;
  db.doc('data/users/'+uid+'/state').set({blocks:priv.blocks.slice(0,500),lastRead:priv.lastRead,agreedAt:priv.agreedAt||0,updatedAt:Date.now()})
  .then(function(){privBusy=false;if(privQ){privQ=false;savePriv();}}).catch(function(){privBusy=false;});}
function markRead(tid){priv.lastRead[tid]=Date.now();clearTimeout(markT);markT=setTimeout(function(){markT=null;savePriv();},800);}
function joinedAt(t){if(t.hostId===uid)return t.createdAt||0;var r=myReq(t);return r?(r.decidedAt||r.at||0):Infinity;}
function unread(t){if(!isMember(t))return 0;var since=Math.max(priv.lastRead[t.id]||0,joinedAt(t));return messages.filter(function(m){return m.tableId===t.id&&m.userId!==uid&&!isBlockedUser(m.userId)&&m.at>since;}).length;}
function hostPending(){return tables.filter(function(t){return t.hostId===uid&&upcoming(t);}).reduce(function(n,t){return n+pendingOf(t).length;},0);}
function myBadge(){return tables.reduce(function(n,t){return n+unread(t)+(needsReview(t)?1:0);},0)+hostPending();}
function notify(tid,title,body){S.notice={tid:tid,title:title,body:body};clearTimeout(notify._t);notify._t=setTimeout(function(){S.notice=null;render();},5000);}

// ---------- writes ----------
function saveProfile(data,okMsg){
  if(!uid)return Promise.resolve();
  var next=Object.assign({},me(),data,{updatedAt:Date.now()});delete next._id;
  profiles[uid]=next;render();
  return db.doc('profiles/'+uid).set(next).then(function(){if(okMsg)toast(okMsg);}).catch(function(e){fail(e);});
}
function guard(){
  if(myRestriction()){toast(fmtDate(myRestriction())+'까지 이용이 제한돼요');return false;}
  return true;
}
function createTable(){
  var f=S.form;if(!guard())return;
  if(!f.title.trim()){toast('한 줄 소개를 입력해 주세요');return;}
  if(!f.quick&&(!f.date||!f.time)){toast('날짜와 시간을 정해 주세요');return;}
  var date=f.date,time=f.time;
  if(f.quick){var d=new Date(Date.now()+30*60e3);d.setMinutes(Math.ceil(d.getMinutes()/10)*10);date=ymd(d);time=pad(d.getHours())+':'+pad(d.getMinutes()%60);}
  S.busy=true;render();
  db.collection('tables').add({hostId:uid,title:f.title.trim().slice(0,60),area:f.area,place:f.place.trim().slice(0,40),menu:f.menu,mode:f.mode,purposes:f.purposes.slice(0,3),
    date:date,time:time,quick:!!f.quick,genderOnly:f.only?myGender():null,ageMin:f.range?f.amin:null,ageMax:f.range?f.amax:null,capacity:Math.max(2,Math.min(6,f.capacity|0)),note:f.note.trim().slice(0,300),createdAt:Date.now(),status:'open'})
  .then(function(ref){S.busy=false;S.form=null;S.sel=ref.id;S.prev='home';S.screen='detail';toast(f.quick?'번개 밥약을 열었어요':'밥약을 열었어요');})
  .catch(fail);
}
function requestJoin(t){
  if(!guard())return;
  if(hasBlockedMember(t)){toast('차단한 사용자가 있는 밥약이에요');return;}
  if(gBlocked(t)){toast(blockReason(t));return;}
  if(isFull(t)){toast('이미 인원이 다 찼어요');return;}
  S.busy=true;render();
  db.collection('joins').doc(safeId(t.id)+'__'+safeId(uid)).set({tableId:t.id,userId:uid,at:Date.now(),status:'pending',msg:S.reqMsg.trim().slice(0,80)})
  .then(function(){S.busy=false;S.reqMsg='';toast('신청했어요. 모집자가 수락하면 알려드려요');}).catch(fail);
}
function decide(t,r,ok){
  if(ok&&isFull(t)){toast('인원이 다 찼어요');return;}
  S.busy=true;render();
  db.collection('joins').doc(r._id).update({status:ok?'accepted':'declined',decidedAt:Date.now()})
  .then(function(){S.busy=false;toast(ok?nick(r.userId)+'님과 매칭됐어요':'신청을 거절했어요');}).catch(fail);
}
function cancelReq(t){var r=myReq(t);if(!r)return;S.busy=true;render();db.collection('joins').doc(r._id).delete().then(function(){S.busy=false;toast('참여를 취소했어요');}).catch(fail);}
function kick(t,id){var r=reqsOf(t).filter(function(x){return x.userId===id;})[0];if(!r)return;S.busy=true;S.memMenu=null;render();db.collection('joins').doc(r._id).delete().then(function(){S.busy=false;toast('밥약에서 내보냈어요');}).catch(fail);}
function closeTable(t){
  S.busy=true;render();
  var chain=Promise.resolve();
  reqsOf(t).forEach(function(r){chain=chain.then(function(){return db.collection('joins').doc(r._id).delete();});});
  messages.filter(function(m){return m.tableId===t.id;}).forEach(function(m){chain=chain.then(function(){return db.collection('messages').doc(m._id).delete();});});
  chain=chain.then(function(){return db.collection('tables').doc(t.id).delete();});
  chain.then(function(){S.busy=false;S.confirmDel=false;S.screen='my';S.sel=null;toast('밥약을 닫았어요');}).catch(fail);
}
function sendMsg(t,txt,sys){
  txt=(txt||'').trim();if(!txt)return;
  if(!sys){S.draft='';var el=document.getElementById('chat-in');if(el)el.value='';}
  db.collection('messages').add({tableId:t.id,userId:uid,text:txt.slice(0,300),sys:!!sys,at:Date.now()}).catch(function(e){if(!sys)S.draft=txt;fail(e);});
}
function arrived(t){sendMsg(t,nick(uid)+'님이 도착했어요',true);toast('도착을 알렸어요');}
function submitReview(t){
  var rv=S.rv||{},items=Object.assign({},(reviews[uid]&&reviews[uid].items)||{}),nsItems=Object.assign({},(noshows[uid]&&noshows[uid].items)||{}),anyNs=false,any=false;
  membersOf(t).filter(function(id){return id!==uid;}).forEach(function(id){
    var r=rv[id]||{tags:[],again:false,ns:false},k=reviewKey(t,id);
    if(r.ns){nsItems[k]={tableId:t.id,target:id,at:Date.now()};anyNs=true;}
    else{items[k]={tableId:t.id,target:id,tags:(r.tags||[]).slice(0,5),again:!!r.again,at:Date.now()};}
    any=true;
  });
  if(!any)return;
  var cut=Date.now()-180*864e5;[items,nsItems].forEach(function(o){Object.keys(o).forEach(function(k){if((o[k].at||0)<cut)delete o[k];});});
  S.busy=true;render();
  var p=db.doc('reviews/'+uid).set({items:items});
  if(anyNs)p=p.then(function(){return db.doc('noshows/'+uid).set({items:nsItems});});
  p.then(function(){S.busy=false;S.rv=null;S.screen='my';toast('후기를 남겼어요. 고마워요!');}).catch(fail);
}
function toggleBlock(id){var i=priv.blocks.indexOf(id);if(i>=0){priv.blocks.splice(i,1);toast('차단을 풀었어요');}else{priv.blocks.push(id);toast(nick(id)+'님을 차단했어요');}S.memMenu=null;savePriv();render();}
function addAd(){var f=S.adForm;if(!f.name.trim()){toast('가게 이름을 입력해 주세요');return;}S.busy=true;render();
  db.collection('ads').add({name:f.name.trim().slice(0,40),area:f.area,menu:f.menu,copy:f.copy.trim().slice(0,200),perk:f.perk.trim().slice(0,60),addr:f.addr.trim().slice(0,80),createdAt:Date.now()})
  .then(function(){S.busy=false;S.adForm=null;S.screen='my';toast('광고를 등록했어요');}).catch(function(e){S.busy=false;toast(e&&e.code==='invalid_argument'?'광고는 관리자만 등록할 수 있어요':'등록하지 못했어요');});}
function delAd(id){db.collection('ads').doc(id).delete().then(function(){toast('광고를 내렸어요');}).catch(function(){toast('삭제하지 못했어요');});}

// ---------- view helpers ----------
function chips(list,cur,act,multi){return list.map(function(v){var val=Array.isArray(v)?v[0]:v,lab=Array.isArray(v)?v[1]:v,on=multi?(cur||[]).indexOf(val)>=0:cur===val;return '<button class="chip'+(on?' on':'')+'" data-act="'+act+'" data-v="'+esc(val)+'" aria-pressed="'+(on?'true':'false')+'">'+esc(lab)+'</button>';}).join('');}
function checkRow(act,on,label){return '<button class="ckrow" data-act="'+act+'" aria-pressed="'+(on?'true':'false')+'"><span class="ck'+(on?' on':'')+'" aria-hidden="true">'+(on?'✓':'')+'</span><span>'+label+'</span></button>';}
function modeTag(t){var k=t.mode==='talk'?'talk':'quiet';return '<span class="tag '+k+'">'+MODE[k]+'</span>';}
function mannerChips(id,n){var m=mannerOf(id);if(!m.top.length)return '';return '<div class="mtags">'+m.top.slice(0,n||3).map(function(tg){return '<span class="mtag">'+esc(tg)+' '+m.counts[tg]+'</span>';}).join('')+'</div>';}
function card(t,showWhy){
  var n=membersOf(t).length,full=n>=t.capacity,mi=showWhy?matchInfo(t):null,u=unread(t),mr=myReq(t),mt=mannerOf(t.hostId);
  var status=isMember(t)&&t.hostId!==uid?'<span class="tag ok">참여 확정</span>':(mr&&mr.status==='pending'?'<span class="tag">수락 대기</span>':'');
  if(t.hostId===uid){var pc=pendingOf(t).length;status='<span class="tag ok">내 밥약</span>'+(pc?'<span class="tag new">신청 '+pc+'</span>':'');}
  if(needsReview(t))status+='<span class="tag new">후기 남기기</span>';
  return '<button class="card" data-act="open" data-id="'+esc(t.id)+'">'+
   '<span class="thumb" style="background:'+(TINTS[t.menu]||'#F1E6D2')+'">'+esc(t.menu)+'</span>'+
   '<span class="cbody">'+(mi&&mi.why.length?'<span class="reason">'+esc(mi.why.join(' · '))+'</span>':'')+
   '<span class="muted">'+esc(t.area)+' · '+(t.place?esc(t.place):'식당은 채팅에서 정해요')+'</span>'+
   '<span class="ctitle">'+esc(t.title)+'</span>'+
   '<span class="tags">'+(t.quick?'<span class="tag bolt">번개</span>':'')+modeTag(t)+'<span class="tag">'+dayLabel(t.date)+' '+timeLabel(t)+'</span>'+(t.genderOnly?'<span class="tag g">'+GL[t.genderOnly]+'만</span>':'')+(ageRangeTxt(t)?'<span class="tag g">'+esc(ageRangeTxt(t))+'</span>':'')+(full?'<span class="tag full">모집 완료</span>':'')+status+(u?'<span class="tag new">새 메시지 '+u+'</span>':'')+'</span>'+
   '<span class="hostline">'+esc(nick(t.hostId))+' · '+esc(gTxt(t.hostId))+(ageOf(t.hostId)?' · '+esc(ageOf(t.hostId)):'')+(mt.top[0]?' · '+esc(mt.top[0]):'')+'</span>'+
   '<span class="cnt">'+n+'/'+t.capacity+'명 · 각자 결제</span></span></button>';
}
function adCard(a){return '<button class="adc" data-act="openAd" data-id="'+esc(a._id)+'"><span class="adth" style="background:'+(TINTS[a.menu]||'#F1E6D2')+'">'+esc(a.menu||'')+'</span><span class="adb"><span class="adl">광고</span><b>'+esc(a.name)+'</b><span class="muted">'+esc(a.area||'')+'</span>'+(a.perk?'<span class="adp">'+esc(a.perk)+'</span>':'')+'</span></button>';}
function notes(){
  var u=myRestriction(),h='';
  if(u)h+='<div class="banner2 red">'+(isBanned(uid)?'운영 정책에 따라 ':'노쇼 신고가 '+NS_LIMIT+'회 쌓여 ')+fmtDate(u)+'까지 밥약을 열거나 신청할 수 없어요.</div>';
  if(readOnly||canWrite===false)h+='<div class="banner2">지금은 둘러보기만 할 수 있어요. 함께 쓰려면 공유한 사람에게 편집 권한을 요청해 주세요.</div>';
  return h;
}
function topBar(title,back){return '<div class="top">'+(back?'<button class="iconbtn" data-act="back" aria-label="뒤로">'+ICON.back+'</button>':'<span style="width:16px"></span>')+'<h1>'+title+'</h1></div>';}

// ---------- screens ----------
function needOnboard(){return db&&uid&&privLoaded&&loaded.p&&!priv.agreedAt&&!(readOnly||canWrite===false);}
function obOk(o){return !!(o.nick.trim()&&o.gender&&validBy(o.by)&&o.area&&o.purposes.length&&o.age&&o.agree);}
function vOnboard(){
  var o=S.ob||(S.ob={nick:me().nick||'',gender:me().gender||null,by:me().birthYear?String(me().birthYear):'',diets:(me().diets||[]).slice(),area:me().area||'상도동',purposes:(me().purposes||[]).slice(),age:false,agree:false});
  var ok=obOk(o);

function onReqs(arr){
  if(reqSeen===null){reqSeen={};arr.forEach(function(r){reqSeen[r._id]=r.status;});return;}
  arr.forEach(function(r){
    var prev=reqSeen[r._id];reqSeen[r._id]=r.status;if(prev===r.status)return;
    var t=byId(r.tableId);if(!t)return;
    if(r.userId===uid&&r.status==='accepted'&&prev)notify(t.id,'매칭됐어요 · '+t.title,'채팅방이 열렸어요. 만날 식당을 정해 보세요');
    else if(r.userId===uid&&r.status==='declined'&&prev)toast('이번 밥약은 매칭되지 않았어요');
    else if(t.hostId===uid&&r.status==='pending'&&!prev&&r.userId!==uid&&!isBlockedUser(r.userId))notify(t.id,'새 신청 · '+t.title,nick(r.userId)+'님이 같이 먹고 싶어 해요');
  });
}
function onMsgs(arr){
  if(!msgInit){msgInit=true;arr.forEach(function(m){seenMsg[m._id]=1;});return;}
  arr.forEach(function(m){
    if(seenMsg[m._id])return;seenMsg[m._id]=1;
    if(m.userId===uid||isBlockedUser(m.userId)||m.at<bootAt-5000)return;
    var t=byId(m.tableId);if(!t||!isMember(t))return;
    if(S.screen==='detail'&&S.sel===t.id){markRead(t.id);return;}
    notify(t.id,(m.sys?'도착 알림':'새 메시지')+' · '+t.title,m.sys?m.text:nick(m.userId)+': '+m.text);
  });
}
function sub(q,key){
  q.onSnapshot(function(snap){
    var arr=snap.docs.filter(function(d){return d.exists;}).map(function(d){var o=Object.assign({},d.data());o._id=d.id;if(key==='t')o.id=d.id;return o;});
    if(key==='t')tables=arr.filter(function(t){return t.hostId&&t.title;});
    else if(key==='r'){reqs=arr;onReqs(arr);}
    else if(key==='p'){var mp={};arr.forEach(function(o){mp[o._id]=o;});profiles=mp;}
    else if(key==='n'){var nm={};arr.forEach(function(o){nm[o._id]=o;});noshows=nm;}
    else if(key==='v'){var vm={};arr.forEach(function(o){vm[o._id]=o;});reviews=vm;}
    else if(key==='a')ads=arr.filter(function(a){return a.name;});
    else if(key==='b'){var bm={};arr.forEach(function(o){if(o.userId)bm[o.userId]=o;});bans=bm;}
    else if(key==='d'){var md=arr.filter(function(o){return o._id==='noshow';})[0];moder={dismissed:(md&&md.dismissed)||{}};}
    else{messages=arr;onMsgs(arr);}
    if(!snap.metadata.fromCache||arr.length)loaded[key]=true;
    render();
  },function(){loaded[key]=true;if(key==='t')loadErr='잠시 후 다시 열어 주세요';render();});
}

  sub(db.collection('reviews').limit(1000),'v');
  sub(db.collection('ads').orderBy('createdAt','desc').limit(30),'a');
  sub(db.collection('bans').limit(1000),'b');
  sub(db.collection('moderation').limit(10),'d');
  sub(db.collection('messages').orderBy('at','desc').limit(500),'m');
  db.doc('data/users/'+uid+'/state').onSnapshot(function(d){
    if(d.exists&&!d.metadata.hasPendingWrites&&!privBusy&&!markT){var x=d.data()||{};priv.blocks=(x.blocks||[]).slice();priv.agreedAt=Math.max(priv.agreedAt||0,x.agreedAt||0);var lr=x.lastRead||{};Object.keys(lr).forEach(function(k){priv.lastRead[k]=Math.max(priv.lastRead[k]||0,lr[k]||0);});}
    privLoaded=true;render();
  },function(){privLoaded=true;render();});
  var iv=setInterval(function(){if(loaded.t){clearTimeout(timer);slow=false;clearInterval(iv);}},500);
  setInterval(function(){if(S.screen==='detail'||S.screen==='my'||S.screen==='home')render();},60000);
  render();
}
if(FB){FB.auth.onAuthStateChanged(function(u){
  if(APP_MODE==='admin'){
    authUser=u&&!u.isAnonymous?u:null;dbChecked=true;
    if(!authUser){render();return;}
    FB.db.doc('admins/'+u.uid).get().then(function(d){amAdmin=d.exists;adminChecked=true;if(amAdmin)start(u.uid);else render();}).catch(function(){amAdmin=false;adminChecked=true;render();});
    return;
  }
  if(!u){FB.auth.signInAnonymously().catch(function(){dbChecked=true;loadErr='Firebase 콘솔에서 익명 로그인을 켜 주세요';render();});return;}
  start(u.uid);
});}
render();
})();
</script>
